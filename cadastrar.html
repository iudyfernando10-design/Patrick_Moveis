<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Patrick Móveis - Cadastrar Estoque</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="paginas.css" />
</head>
<body data-page="cadastrar">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content">
    <header class="topbar" id="topbar"></header>
    <section class="pagina">
      <h2 class="ptitle">Cadastrar Estoque</h2>
      <form class="card form" id="f-prod">
        <label>Nome do produto<input name="nome" required placeholder="Ex: Sofá 3 lugares" /></label>
        <label>Categoria
          <select name="categoria"><option>Sofás</option><option>Mesas</option><option>Cadeiras</option><option>Camas</option><option>Guarda-roupas</option><option>Outros</option></select>
        </label>
        <label>Quantidade<input name="qtd" type="number" min="1" value="1" required /></label>
        <label>Preço de venda (R$)<input name="preco" type="number" min="0" step="0.01" required /></label>
        <label>Custo unitário (R$)<input name="custo" type="number" min="0" step="0.01" value="0" /></label>
        <label class="check"><input type="checkbox" name="compra" checked /> Registrar a compra como saída no financeiro</label>
        <button class="btn" type="submit">Cadastrar Produto</button>
      </form>
    </section>
    <footer class="footer" id="footer"></footer>
  </main>
</div>
<script src="script.js"></script>
</body>
</html>
